# port.toml: a PortMaster port made with `python -m pmunity port new` (docs/porting.md).
# Edit, then run `port new <name> --data <game>` again to regenerate the port folder.

# the port: its folder in ports/ (name), the menu entry and launcher "<title>.sh" (title), the
# route (port check recommends one), port.json fields, the patcher's time estimate
[port]
name = "hollowknight"
title = "Hollow Knight"
route = "android"
porter = ["wild1walker"]
desc = "Hollow Knight, the hand-drawn action adventure by Team Cherry, on Unity's own Android player (run natively, no emulator). You need your own copy: the Linux version from GOG or Steam."
inst = "Put the GOG Linux installer as downloaded (hollow_knight_*.sh, no renaming), or the game folder from GOG or Steam into ports/hollowknight/gamedata, then launch. The first launch builds the game on the handheld."
genres = ["action", "adventure", "platformer"]
availability = "paid"
store = [{name = "GOG", gameurl = "https://www.gog.com/game/hollow_knight", developerurl = "https://www.teamcherry.com.au/"}, {name = "Steam", gameurl = "https://store.steampowered.com/app/367520/Hollow_Knight/", developerurl = "https://www.teamcherry.com.au/"}]
setup_time = "one to three hours"
exp = false
thanks = "Thanks to [Team Cherry](https://www.teamcherry.com.au/) for creating Hollow Knight and its hand-drawn kingdom of Hallownest."
ready_marker = ".setup_done"

# what the player provides: the data folder the setup looks for (data, a glob), the build
# kind (linux | macos | windows), the Unity versions the setup accepts (empty: any the
# converter supports), how READMEs and messages describe it (what), its size in MB
[game]
data = "Hollow Knight_Data"
build = "linux"
unity_versions = ["6000.0.61f1"]
what = "Hollow Knight for Linux (Unity 6000.0.61f1): GOG's installer as downloaded (hollow_knight_*.sh, no renaming), or the game folder from GOG or Steam"
size_mb = 4999
setup_space_mb = 0
developer = "Team Cherry"
publisher = "Team Cherry"
release_date = "2017-02-24"

# Unity's Android player: backend/abi; url = the installer (`pmunity player url <version>`; empty:
# looked up on the handheld); sha256 = {"<file>" = "<hash>"} checked after the fetch
[player]
backend = "mono"
abi = "armeabi-v7a"
url = "https://download.unity3d.com/download_unity/74a0adb02c31/TargetSupportInstaller/UnitySetup-Android-Support-for-Editor-6000.0.61f1.exe"
sha256 = {"libmain.so" = "f9ea09a232a33b4c971bfcb45053fc5ef4c7ccc5999014d7bf7f46bae0bd5a31", "libunity.so" = "4ac0f68ffd66e0af2470544b75500ccda60e1d3c00b172e870690bf75000007d"}
# the donors the release ships: the 32-bit Mono player, and Unity's 64-bit IL2CPP player for the 64-bit
# build (setup/patchscript64, on systems without a 32-bit userland: the game's own assemblies on Unity's Mono
# for 64-bit ARM behind that player's libil2cpp.so, nothing compiled; its engine modules from the Mono donor)
donors = ["donor-6000.0.61f1-mono-armv7.apk", "donor-6000.0.61f1-il2cpp-arm64.apk"]

# pmunity convert's config (each step's DEFAULTS); "textures" re-encodes BC/DXT as ASTC
# (less memory, a longer setup, slightly different pixels: off unless you add it)
[convert]
steps = ["shaders", "settings", "audio", "textures", "video"]
# the cinematics (1920x1080 VP8: more than an A53 decodes in time while the game runs) halved to
# 960x540 where the handheld has 1 GB of RAM or less (pmu's video step: mode "auto", ram_mb 1024,
# max_height 720); they look the same on a 720x480 panel and play at their 30 pictures a second.
# [convert.video] mode = "off" keeps them as they are everywhere.
# blend-mode sprites read the framebuffer instead of a grab copy before each of them: King's Pass
# 18 passes a frame instead of 24 (+11 %); not exact: about 1.6 % of the static pixels off by 1 - 6
# of 255 on the Mali (docs/shaders.md). The decision for this port: faster; "false" is the PC picture.
[convert.shaders]
grab_fetch = "always"
# the game's resident atmosphere loops decoded at load as it has them, up to 36 MiB of PCM a scene
# (16 by default): FMOD's mixer 56 -> 47 % of a core, memory as before (docs/profiling.md)
[convert.audio]
pcm_budget_mb = 36
# on handhelds with 1 GB of RAM or less (pmu's lowmem_pcm_budget_mb, ram_mb 1024) 16 MiB a scene: dArkOS keeps
# EmulationStation in memory while a port runs (64 - 126 MB on the G350, no swap), and with the 36 MiB budget City
# of Tears ran a G350 out of memory. muOS RG34XX-SP, City of Tears, with the textures below: the game 663 -> 597 MB, the lowest
# available 266 -> 332 MB, 56.0 -> 56.3 fps; FMOD decodes the long clips as they play (a little more CPU).
lowmem_pcm_budget_mb = 16
# where the handheld has 1 GB of RAM or less, textures at 0.375 of their size (lowmem_scale, ram_mb 1024; 0.5 until
# 2026.11.09.3): the game draws there at 540x360 (480x360 on 4:3), and Hallownest's art, made for 1080p, still has
# about a texel for each pixel of it (405 lines for 360). Text atlases (SDF, tmpro, Font Texture) stay at full size.
# (Side by side at 540x360 the same picture.) Elsewhere scale; the full textures back: unset it, run the setup again.
# There also ASTC blocks of 6x6 texels instead of 4x4 (lowmem_block): 3.56 bits a texel instead of 8, the textures'
# memory (in the GPU's share of the 1 GB) and the GPU's texture reads less than half. Testers found 8x8 visibly
# blocky and 6x6 good enough; text atlases keep 4x4 (sharp_block).
[convert.textures]
scale = 1.0
lowmem_scale = 0.375
lowmem_block = [6, 6]
sharp_names = "SDF|tmpro|Font Texture"
block = [4, 4]
quality = "medium"
mips = "keep"
[convert.settings]
graphics_apis = [11]

# pmunity android-data: asmpatch = auto (run tools/asmpatch; it changes only what it
# finds: Rewired, the Input System package) | off | ["patch", ...]; streaming_assets = obb |
# both | loose (code that reads StreamingAssets as files: also/only beside the APK,
# docs/android-data.md); data_path = true (files read or written at Application.dataPath);
# name = the APK's, package (keep it: it names the PlayerPrefs file); args = more options
[android_data]
asmpatch = ["auto", "hk-blur", "hk-aspect", "hk-pad-letters", "hk-render-size"]      # the default patches, the blur reduction ASMPATCH_HK_BLUR reads, the screen fit ASMPATCH_HK_ASPECT reads, the prompts' letters UA_PAD_LETTERS reads, the world's render size ASMPATCH_HK_RENDER_SIZE reads (tools/asmpatch)
video_shader = true
swappy = "off"
streaming_assets = "both"
data_path = false
name = "HollowKnight"
package = "com.pmunity.hollowknight"
args = []

# the game's controls for the README and the testing thread, as the handheld labels its buttons (the
# Nintendo layout: B at the bottom); Hollow Knight's own defaults, by position (the game's Options,
# Controller changes them)
[controls]
"D-pad" = "Move; with up or down, the nail and spells go that way"
"B (bottom)" = "Jump; confirm in menus"
"Y (left)" = "Attack with the nail"
"A (right)" = "Focus (hold) and cast spells; back in menus"
"X (top)" = "Dream Nail"
"R2" = "Dash"
"L2" = "Crystal Dash"
"L1" = "Quick map"
"R1" = "Quick cast"
"Select" = "Inventory"
"Start" = "Pause"
"Select + Start" = "Quit"

# ua_host's environment (docs/runtime.md, docs/input.md), written to port.env:
# e.g. UA_POINTER = "1", UA_POINTER_CURSOR = "0", UA_KEYMAP = "start:escape", UA_PAD_NAME,
# UA_OSK = "done" (the on-screen keyboard answers every soft keyboard at once), UA_KEYBOARD = "1"
[runtime]
# The pad as an Xbox pad: the buttons work by position, the bottom one jumps and confirms (as in the
# game on every pad). Not a Switch pad's name: InControl's Input System device swaps a Switch pad's face
# buttons by letter, and the right button jumped (until 2026.11.08.2). The prompts show the letters
# printed on the handheld: asmpatch's hk-pad-letters ([android_data] below) gives them the Switch Pro
# Controller's glyphs (B at the bottom, A on the right, as on Anbernic and most handhelds); "xbox" keeps
# the game's Xbox glyphs, for handhelds printed like an Xbox pad. The buttons stay where they are either way.
UA_PAD_NAME = "Xbox Wireless Controller"
UA_PAD_LETTERS = "nintendo"
# Mono compiles each of the game's methods the first time it runs, in that frame: the first slash,
# hit or death stalled for its compiling (50-240 ms). The methods compiled are listed in
# data/jitwarm.txt and compiled ahead at the next launch, over the title and the first load
# (ua_host UA_JIT_WARM; Hollow Knight's static field initializers are constants and collections,
# so compiling them earlier changes nothing). King's Pass on the RG34XX-SP: no compiling in the
# walk until the death's save, hitches of 100 ms or more 8 -> 4.
UA_JIT_WARM = "1"
# The layers below draw the same picture and were measured on the RG34XX-SP (Knulli, Mali-G31),
# 2026-11-07, steady fps walking with attacks, screenshots checked in each area (portmaster-unity
# docs/runtime.md has each one). Set one to "" in port.env to turn it off.
# Unity's dynamic geometry (sprites, text, particles) in one persistently mapped arena, drawn with
# glDrawRangeElements (the Mali driver keeps a stale index range for a buffer written through a
# mapping, which stretched sprites into black slabs on 2026-11-06; the range given with each draw
# makes it exact). Greenpath 42.1 -> 47.3.
UA_GL_ARENA = "1"
# Unity's GLES buffers reused from a pool instead of made and deleted every frame: 40.5 -> 42.1
UA_GLES_POOL = "1"
# Unity waits for a frame's present at the end of its frame instead of the start of the next
# (its own GraphicsDeviceSettings.waitForPresentSyncPoint): the main thread's work overlaps the
# GPU's. Greenpath 47.5 -> 50.0; a press can reach the screen up to one frame later.
UA_PRESENT_SYNC = "end"
# ua_host's GL state memo off: it skips nothing in Hollow Knight and costs the render thread: 50.0 -> 51.2
UA_GL_MEMO = "0"
# The lit sprite shader's light term folded away while the game's light colour is 0 (always, in
# Hollow Knight): the same bits (50 draws compared on the RG34XX-SP, 0 differ), 5.1 -> 1.4 cycles
# a fragment on the Mali-G31. City of Tears 51.8 -> 55.8, Crystal Peak 54.8 -> 56.9, Dirtmouth
# 57.1 -> 58.4, Gruz Mother in the Hall of Gods 49.3 -> 54-56, Greenpath and Deepnest as before.
# The first launch with it compiles the game's shaders again (about 3 s over the first loads).
UA_GL_SPEC = "1"
# The game's background flip-books (crowds, pulsing blobs, waterfalls, lamp bugs: an Animator whose one
# looping clip only swaps its own sprite, the 125 controllers in flipbooks.txt) shown by a small stand-in
# instead of Unity's whole animation pipeline (ua_host's uaflipbook.dll): it watches each Animator until 240
# frames in a row agree, then sets the sprite itself from the same time; the game's own changes hand it back.
# Broken Vessel's arena (about 110 of them) 47.5 - 48.8 -> 54.6 fps, Gruz Mother 53.7 - 54.8 -> 55.7,
# Greenpath 52.0 - 52.5 -> 53.0. Not bit-exact: about once in 5,000 frames one of these sprites changes a
# frame (1/60 s) early or late; the game itself (its state, hits, timing) is untouched.
# The list's last 18 lines ("<controller>:<state>") are rest poses: grass, cords, rags, Deepnest's
# mushrooms and vines that move only when touched. Their Animators are off while at rest and on again on
# the frame a touch changes a parameter, before that frame's animation step: the same state at the same
# time as the game's own (checked on the RG34XX-SP). Greenpath 52.6 - 52.9 -> 54.3 - 54.6.
UA_FLIPBOOK = "@flipbooks.txt"
# The picture fills the screen: Hollow Knight letterboxes screens narrower than 16:10 (bars on 3:2 and
# 4:3 handhelds) and shows more above and below from 16:9 down to 16:10; asmpatch's hk-aspect carries that
# rule of its own down to 1:1, so a 720x480 or 640x480 screen is filled: the width of 16:9, more above and
# below, the HUD in the top corner. The same frame rates (RG34XX-SP Greenpath 52.6, Dirtmouth 58.3).
# "" brings the bars back.
ASMPATCH_HK_ASPECT = "fill"
# Handhelds whose Mali driver draws through SDL's KMSDRM (RK3326: the R36S family, the BattleXP G350) wait
# in each swap until the GPU has finished the frame, so the game's render thread and the GPU took turns.
# ua_host's present thread shows the frames instead (where the game renders at a smaller size: the
# 1 GB handhelds below): the render thread goes straight on with the next frame. The same picture, up to
# two frames queued. G350: Greenpath 17.5 -> 25.1 fps, King's Pass 32 -> 38, Dirtmouth 31 -> 50.
# Nothing changes on the fbdev handhelds (Knulli, muOS on the H700).
UA_PRESENT_THREAD = "1"
# On those handhelds the render thread then spends most of each frame in the driver's draw calls:
# ua_host's GL thread (UA_GL_REC=auto: wherever the present thread runs) makes them, and the swap, while
# the render thread goes on with the next frame. The same calls in the same order, one frame in flight.
# G350: Greenpath 23 -> 32 fps. Nothing changes on the fbdev handhelds.
UA_GL_REC = "auto"
# Knifethrower's libpmhwdec (portmaster-unity tools/pmhwdec/build.sh, shipped in pmhwdec/ by [build] below):
# the cinematics (VP8) decoded on the video engine of Allwinner handhelds (H700, A133: Knulli, muOS) and,
# through Rockchip MPP shipped beside it, of RK3326 ones on dArkOS (the launcher opens the decoder's
# nodes to the video group for the game and puts them back when it ends). Where it finds no decoder it
# can use, it says so at once (32 ms on the G350 before) and libvpx plays them as before. RG34XX-SP, the 1080p intro: the four cores 73 -> 54 % busy, the lowest second
# 20 -> 33 fps. The path is the port folder's (ua_host's working folder). Where its test program
# (pmhwdec/pmhwdec-test) finds the decoder, the setup leaves the cinematics at full size (Knifethrower's idea):
# no re-encode on 1 GB Allwinner handhelds, a shorter setup
UM_PMHWDEC = "pmhwdec/libpmhwdec.so.1"
# (UA_GL_PERSIST, the same arena without the ranged draws, stays off: the slabs above.)

# The Low picture, on every handheld: the picture gives a little, the game play nothing (portmaster-unity
# docs/porting.md "The Low picture at launch"). The setup offers no other picture (players who chose a
# heavier one would get the port's worst frame rates). Measured on the RG34XX-SP in King's Pass, walking
# and fighting (portmaster-unity docs/compat/games.md); an RG552 (4 GB, 1920x1152) that had none of it
# drew King's Pass at about 11 fps. By hand only: UA_PICTURE=high at the top of port.env skips all of
# it, or one at a time: ASMPATCH_HK_BLUR=full keeps the game's background blur, UA_RENDER_SIZE= and
# UA_RENDER_PIXELS= (empty) render at the panel's size; the game's own options are in its Options, Video.
[runtime_low]
# no background blur: the background camera off and the far background drawn sharp (NoBlur's look);
# the main thread draws one camera fewer
ASMPATCH_HK_BLUR = "off"
# on 1 GB handhelds the game rendered at 540x360 and scaled to the panel (by the display engine on the
# fbdev path, else the GPU): softer. 540x360 rather than 600x400 since 2026-11-04: the GPU-bound rooms
# gain most (City of Tears 41.3 -> 47.3 fps, Crystal Peak 48.2 -> 52.9, Queen's Gardens 52.3 -> 54.0 on
# Knulli; Greenpath 41.4 -> 43.6 on muOS), the picture a little softer still. Square screens (720x720) 480x480
# instead of the 360x360 that 540x360 fits into them (hard to read, testers said): Greenpath on a 1:1 stand-in
# (RG34XX-SP, UA_ASPECT=1:1) 53.6 fps at 360x360, 52.3 at 440x440, 51.5 at 480x480
UA_RENDER_SIZE = "540x360 480x480"
# that render size by the game itself, its HUD, inventory, map and dialogue text at the panel's size (testers could
# not read the inventory's small text on a 3.4" 720x480 panel scaled up from 540x360): ua_host gives the size to
# asmpatch's hk-render-size in ASMPATCH_HK_RENDER_SIZE and Unity keeps the panel's size (portmaster-unity
# docs/runtime.md UA_RENDER_SIZE_VAR, tools/asmpatch/README.md). G350 (640x480, world at 480x360): Greenpath 41.8
# fps without, 41.7 with; the title menu, drawn whole at the panel's size, 60 -> 50. The launcher turns it off
# for a game whose code has not had that patch (.patches, written by the setup and the update)
UA_RENDER_SIZE_VAR = "ASMPATCH_HK_RENDER_SIZE"
UA_RENDER_RAM = "1024"
# on bigger devices at most about 560,000 pixels, scaled up by the GPU: a 1920x1152 screen 960x576, a
# 1920x1080 one 992x558; a 720x480 one stays at its size
UA_RENDER_PIXELS = "560000"
# the game's own video options at their lowest (Options, Video), as defaults the game reads until the
# player picks otherwise there (ua_host UA_PREFS_DEFAULTS; a choice in the menu is stored and kept):
# Shader Quality Low (its blur in one pass group; none with the blur off above), Particle Effects Low
# (halves the decorative particle systems the developers tagged), Dithering off, Noise off. City of
# Tears 45.1 -> 46.3 - 48.2 fps at 540x360 with Particles Low and Dithering off (muOS)
UA_PREFS_DEFAULTS = "ShaderQuality=0 VidParticles=0 VidDithering=0 VidNoise=0"

# On handhelds with 1 GB of RAM or less (MemTotal at most 1024 MB, read by port.env at each launch),
# with either picture: the four A53 cores and the memory are short there (docs/porting.md "Small
# handhelds"). Set one at the top of port.env (e.g. UA_AUDIO_RATE= for 48 kHz) and that wins.
[runtime_lowmem]
# Unity's legacy graphics jobs on OpenGL ES (the draw calls built on the job workers; ua_host's
# hook for this player build): the main thread, the limit at 600x400, +9 %; the same picture
UA_GFX_JOBS = "legacy"
# FMOD mixing at 24 kHz instead of 48: duller highs, the same sounds at the same times; its mixer
# 48 -> 31 % of a core, CPU time the chip's shared power budget gives back to the Mali
UA_AUDIO_RATE = "24000"
# one Unity job worker instead of three (the A53's four cores are shared by the main thread, the
# render thread, FMOD's mixer and Mali's submission thread; three workers woken for every job batch
# take CPU from both the main and the render thread). The same jobs, the same results; Greenpath
# 42.1 / 42.2 -> 45.6 fps (Knulli), 44.2 / 43.7 -> 45.9 (muOS), Soul Master 48.9 -> 51.9 / 52.8
# (Knulli), 50.7 -> 51.9 (muOS); the Colosseum, King's Pass and City of Tears as before
UA_UNITY_ARGS = "-job-worker-count 1"

# the porter's own files (paths relative to this file), copied into setup/: converter plugins
# (--plugin), managed = assemblies shipped into the game (--managed-file), assembly_patches =
# [{name, command, files}] ({setup} = the setup folder), hooks = {game|pre_convert|post_convert|
# post_pack|post_install = "x.sh"} sourced by the setup, extra = files for the port folder
[files]
plugins = []
managed = []
assembly_patches = []
hooks = {}
extra = ["flipbooks.txt"]   # the background flip-books' controllers (UA_FLIPBOOK above)

# commands `port package` runs in this folder first (env PMUNITY, PORT_SRC, BUILD), the files
# they make put into the port folder (outputs = {"setup/files/x" = "build/x"}), and their licences
# (licenses = {"LICENSE.x.txt" = "path"})
[build]
# libpmhwdec for both builds (Rockchip MPP only for the 32-bit one: the Rockchip firmwares on vendor kernels, dArkOS
# and ArkOS, have 32-bit libraries), and the 64-bit build's runtime (build64.sh: ua_host64, the Mono bridge and
# Unity's Mono of the 6000.0 line, their licences)
commands = ['"$PMUNITY/tools/pmhwdec/build.sh" "$BUILD/pmhwdec"', '"$PORT_SRC/build64.sh" "$BUILD/arm64"']
outputs = {"pmhwdec/libpmhwdec.so.1" = "{build}/pmhwdec/armhf/libpmhwdec.so.1", "pmhwdec/pmhwdec-cedard" = "{build}/pmhwdec/aarch64/pmhwdec-cedard", "pmhwdec/pmhwdec-test" = "{build}/pmhwdec/armhf/pmhwdec-test", "pmhwdec/librockchip_mpp.so" = "{build}/pmhwdec/armhf/librockchip_mpp.so", "pmhwdec64/libpmhwdec.so.1" = "{build}/pmhwdec/arm64/libpmhwdec.so.1", "pmhwdec64/pmhwdec-cedard" = "{build}/pmhwdec/aarch64/pmhwdec-cedard", "pmhwdec64/pmhwdec-test" = "{build}/pmhwdec/arm64/pmhwdec-test", "ua_host64" = "{build}/arm64/ua_host64", "setup/mono64/6000.0/libil2cpp.so" = "{build}/arm64/mono64/libil2cpp.so", "setup/mono64/6000.0/libmonobdwgc-2.0.so" = "{build}/arm64/mono64/libmonobdwgc-2.0.so", "setup/mono64/6000.0/libMonoPosixHelper.so" = "{build}/arm64/mono64/libMonoPosixHelper.so", "setup/mono64/6000.0/libmono-native.so" = "{build}/arm64/mono64/libmono-native.so"}
licenses = {"LICENSE.libpmhwdec.txt" = "{build}/pmhwdec/src/pmhwdec/LICENSE", "LICENSE.pmhwdec-cedard.txt" = "{build}/pmhwdec/src/pmhwdec/LICENSE.pmhwdec-cedard", "LICENSE.libpmhwdec-libvpx.txt" = "{build}/pmhwdec/src/pmhwdec/licenses/LICENSE.libvpx.txt", "LICENSE.mpp.txt" = "{build}/pmhwdec/armhf/LICENSE.mpp.txt", "LICENSE.mono-6000.0.txt" = "{build}/arm64/LICENSE.mono-6000.0.txt", "LICENSE.bdwgc-6000.0.txt" = "{build}/arm64/LICENSE.bdwgc-6000.0.txt", "LICENSE.corefx-6000.0.txt" = "{build}/arm64/LICENSE.corefx-6000.0.txt"}

# Questions PortMaster's patcher asks before the setup (each answer is kept for later runs), e.g.:
# [[questions]]
# id = "TEXTURE_QUALITY"
# question = "Texture quality? High is what this port is tested with."
# options = [["medium", "High (recommended)"], ["fast", "Low (shorter setup)"]]
# default = "medium"
# convert_set = "textures.quality"        # the answer -> pmunity convert --set textures.quality=<answer>
# # env = "UA_POINTER"                    # or: the answer -> the game's environment

[[questions]]
id = "TEXTURE_QUALITY"
question = "Texture quality? Both turn the textures into ASTC, the format the handheld's GPU reads (the same size and memory). High is what this port is tested with. Low makes the setup much shorter, with slightly less exact textures."
options = [["medium", "High (recommended)"], ["fast", "Low (shorter setup)"]]
default = "medium"
convert_set = "textures.quality"

# The picture shape and the button letters (questions.lua asks the shape only on screens narrower than 16:10):
# no convert setting and no environment; the setups write the answers to aspect.txt and buttons.txt in the
# port folder, which the launcher reads at each launch (players change them there later; a line at the top of
# port.env still wins). questions.lua is the port's own (the shape question depends on the screen).
[[questions]]
id = "ASPECT"
question = "Picture shape? Hollow Knight is 16:9. (Change it later in ports/hollowknight/aspect.txt: fill or bars.)"
options = [["fill", "Fill the screen: the same width, a little more above and below (recommended)"], ["bars", "16:9 with black bars above and below"]]
default = "fill"

[[questions]]
id = "BUTTONS"
question = "Which letters are on your handheld's buttons? The game's prompts show them (the bottom button always jumps). (Change it later in ports/hollowknight/buttons.txt: nintendo or xbox.)"
options = [["nintendo", "Nintendo: A on the right, B at the bottom (recommended)"], ["xbox", "Xbox: A at the bottom, B on the right"]]
default = "nintendo"
